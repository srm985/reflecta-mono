services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    command: sleep infinity
    security_opt:
      - seccomp=./seccomp/seccomp-bwrap-userns.json
    extra_hosts:
      - "host.docker.internal=host-gateway"
    ports:
      - "3100:3100"
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reflecta
      MYSQL_USER: admin
      MYSQL_PASSWORD: supersecretpw
      MYSQL_ROOT_PASSWORD: supersecretpw
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
