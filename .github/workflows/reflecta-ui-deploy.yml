name: Reflecta UI - Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - .eslintrc.js
      - package-lock.json
      - package.json
      - packages/reflecta-ui/**
      - tsconfig.json
      - .github/**
  workflow_dispatch:

jobs:
  lint-scss:
    name: Lint UI SCSS
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run UI SCSS lint
        run: npm run lint:scss -w reflecta-ui

  lint-js:
    name: Lint UI JavaScript and TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Component declarations are generated before lint because UI imports generated remote wrappers.
      - name: Generate component declarations
        run: npm run build -w reflecta-components
        env:
          NODE_ENV: production

      - name: Run UI JavaScript and TypeScript lint
        run: npm run lint:js -w reflecta-ui

  build-components:
    name: Generate component declarations for UI
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Component declarations are generated during the component build and consumed by reflecta-ui.
      - name: Generate component declarations
        run: npm run build -w reflecta-components
        env:
          NODE_ENV: ${{ vars.NODE_ENV }}

      - name: Run UI typecheck with generated component declarations
        run: npm run typecheck -w reflecta-ui

      - name: Upload component declarations
        uses: actions/upload-artifact@v7
        with:
          name: component-declarations
          path: ./packages/reflecta-components/declarations/

  build:
    name: Build UI deployment bundle
    needs: [lint-scss, lint-js, build-components]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download component declarations
        uses: actions/download-artifact@v8
        with:
          name: component-declarations
          path: ./packages/reflecta-components/declarations/

      - name: Build UI
        run: npm run build -w reflecta-ui
        env:
          BASE_URL_API: ${{ vars.BASE_URL_API }}
          FEDERATED_COMPONENTS_URL: ${{ vars.FEDERATED_COMPONENTS_URL }}
          GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
          LOCAL_STORAGE_AUTHENTICATION_TOKEN_KEY: ${{ vars.LOCAL_STORAGE_AUTHENTICATION_TOKEN_KEY }}
          NODE_ENV: ${{ vars.NODE_ENV }}

      - name: Upload UI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-bundle
          path: ./packages/reflecta-ui/dist/

  deploy:
    name: Deploy UI
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download UI artifact
        uses: actions/download-artifact@v8
        with:
          name: ui-bundle
          path: ./bundle/

      - name: Deploy UI bundle
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          key: ${{ secrets.KEY }}
          passphrase: ${{ secrets.KEY_PASSPHRASE }}
          port: ${{ secrets.PORT }}
          rm: true
          source: "./bundle/*"
          strip_components: 1
          target: ${{ vars.DEPLOYMENT_LOCATION_UI }}
          timeout: "120s"
          username: ${{ secrets.USERNAME }}
          overwrite: true
