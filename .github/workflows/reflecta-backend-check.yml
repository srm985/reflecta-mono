name: Reflecta Backend - Check

on:
  push:
    branches: ['*', '!main']
    paths:
      - .eslintrc.js
      - package-lock.json
      - package.json
      - packages/reflecta-backend/**
      - tsconfig.json
      - .github/**
  workflow_dispatch:

jobs:
  check:
    name: Lint and typecheck backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend lint
        run: npm run lint -w reflecta-backend

      - name: Run backend typecheck
        run: npm run typecheck -w reflecta-backend
