name: Reflecta Backend - Build and Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - .eslintrc.js
      - package-lock.json
      - package.json
      - packages/reflecta-backend/**
      - tsconfig.json
      - .github/**
  workflow_dispatch:

jobs:
  check:
    name: Lint and typecheck backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend lint
        run: npm run lint -w reflecta-backend

      - name: Run backend typecheck
        run: npm run typecheck -w reflecta-backend

  bundle:
    name: Build backend deployment bundle
    needs: [check]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build -w reflecta-backend

      - name: Install backend production dependencies
        run: npm ci --omit=dev --ignore-scripts -w reflecta-backend

      # bcrypt ships native bindings, so we rebuild it for the runner target before packaging.
      - name: Rebuild bcrypt native binding
        run: npm explore bcrypt -- npm install

      - name: Stage backend runtime files
        run: |
          cp -r ./node_modules/ ./packages/reflecta-backend/dist/
          cp ./packages/reflecta-backend/package.json ./packages/reflecta-backend/dist/

      - name: Create backend artifact
        run: zip bundle.zip ./packages/reflecta-backend/dist/* -r

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-bundle
          path: ./bundle.zip

  deploy:
    name: Deploy backend
    needs: [bundle]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download backend artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-bundle

      - name: Extract backend artifact
        run: unzip ./bundle.zip

      - name: Deploy backend bundle
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          key: ${{ secrets.KEY }}
          passphrase: ${{ secrets.KEY_PASSPHRASE }}
          port: ${{ secrets.PORT }}
          rm: true
          source: "./packages/reflecta-backend/dist/*"
          strip_components: 3
          target: ${{ vars.DEPLOYMENT_LOCATION_BACKEND }}
          timeout: "120s"
          username: ${{ secrets.USERNAME }}
          overwrite: true
